[package]
name = "payment"
version = "0.3.0"
edition = "2024"
description = "Ferrumec payment service: account balances, credits, deferred debits and a settled-debit ledger."

[dependencies]
actix-web = "4.15.0"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
# `launch` = actix-web bootstrap + permission middleware + OpenTelemetry (implies `web`/`local`).
# `pg`     = Postgres-backed `Infra`, `LocalInfra` and the transactional `Outbox`.
ferrumec = { version = "0.4.6", features = ["local","web", "pg"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9", features = ["postgres", "uuid", "chrono", "macros", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
viewset = { version = "0.6.5", features = ["web"] }

